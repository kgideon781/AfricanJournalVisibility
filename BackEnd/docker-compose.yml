services:
  pgdb:
    container_name: pgdb
    image: postgres
    restart: always
    ports:
      - 127.0.0.1:5432:5432
      # - "127.0.0.1:5432:5432" # Bind to localhost
    environment: 
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    container_name: pgadmin4
    image: dpage/pgadmin4
    restart: always

    environment: 
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-a@a.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-a}
    ports:
        - "127.0.0.1:5050:80"
      # - "127.0.0.1:5050:80" # Bind to localhost

  django:
    build: .
    container_name: django_app
    # command: python manage.py runserver 0.0.0.0:8000
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/usr/src/BackEnd/
    ports:
      - "8000:8000"
      # - "127.0.0.1:8000:8000" # Bind to localhost

    environment:
      - DEBUG=${DEBUG:-0}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost 127.0.0.1}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=${POSTGRES_HOST:-pgdb}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - CELERY_BROKER=${CELERY_BROKER:-amqp://rabbitmq:5672//}
      - CELERY_BACKEND=${CELERY_BACKEND:-rpc://}
    depends_on:
      - pgdb
      - rabbitmq

  celery:
    build: .
    command: celery -A backend worker --loglevel=INFO
    container_name: celery
    volumes:
      - .:/usr/src/BackEnd/
    environment:
      - CELERY_BROKER=${CELERY_BROKER:-amqp://guest:guest@rabbitmq:5672//}
      - CELERY_BACKEND=${CELERY_BACKEND:-rpc://}
    depends_on:
      - pgdb
      - rabbitmq

  celery-beat:
      build: .
      command: celery -A backend beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
      container_name: beat
      volumes:
        - .:/usr/src/BackEnd/
      environment:
        - CELERY_BROKER=${CELERY_BROKER:-amqp://guest:guest@rabbitmq:5672//}
        - CELERY_BACKEND=${CELERY_BACKEND:-rpc://}
      depends_on:
        - pgdb
        - rabbitmq
        - django  

  flower:
      build: .
      container_name: flower_monitor
      
      command: celery -A backend flower --port=5555
      ports:
        - "127.0.0.1:5555:5555"
        # - "127.0.0.1:5555:5555" # Bind to localhost
      environment:
        - CELERY_BROKER=${CELERY_BROKER:-amqp://guest:guest@rabbitmq:5672//}
      depends_on:
        - rabbitmq

  rabbitmq:
    container_name: rabbitmq_broker
    image: rabbitmq:3.8-management
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      # - "127.0.0.1:5672:5672"   # Bind to localhost
      # - "127.0.0.1:15672:15672" # Bind to localhost
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}

  
  

volumes:
  postgres_data:
    external: true
    name: f01ec9fecdcf17a2c680b7a1ae1b1f36572c400dd63f410b61bd001c81391d87
