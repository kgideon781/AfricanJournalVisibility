<!doctype html>
<html>
<body style="font-family:Helvetica,Arial,sans-serif;color:#111;line-height:1.5;padding:16px;">
  <h2 style="margin:0 0 12px;">Review request</h2>
  <p>Hi {{ reviewer_name }},</p>
  <p>You have been assigned to review a manuscript submitted to <strong>{{ journal_title|default:"a journal" }}</strong>.</p>
  <table style="border-collapse:collapse;margin:12px 0;">
    <tr><td style="padding:4px 12px 4px 0;color:#666;">Title</td><td>{{ title }}</td></tr>
    <tr><td style="padding:4px 12px 4px 0;color:#666;">Authors</td><td>{{ authors }}</td></tr>
  </table>
  {% if abstract %}
  <div style="background:#f5f5f5;padding:12px;border-radius:6px;margin:12px 0;">
    <div style="color:#666;font-size:12px;margin-bottom:6px;">Abstract</div>
    <div>{{ abstract }}</div>
  </div>
  {% endif %}
  <p>
    <a href="{{ reviewer_url }}"
       style="display:inline-block;background:#0f172a;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;">
      Open reviewer dashboard
    </a>
  </p>
  <p style="color:#888;font-size:12px;">— African Journals Platform</p>
</body>
</html>
